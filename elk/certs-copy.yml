
# This play copies Certs post them been signed. Signed certs and the root CA go in elk/files/.

---
- name: Deploy signed certificates
  hosts:
    - elasticsearch
    - logstash
    - kibana
    # - oxidized
  become: true

  vars:
    cert_dir: /etc/cert/2026
    server_cert: "{{ cert_dir }}/{{ inventory_hostname }}.cer"

  tasks:

    - name: Copy signed certificate
      copy:
        src: "files/{{ inventory_hostname }}.cer"
        dest: "{{ server_cert }}"
        owner: root
        group: root
        mode: '0644'


    - name: Verify certificate exists
      stat:
        path: "{{ server_cert }}"
      register: cert

    - name: Show certificate path
      debug:
        msg: "{{ cert.stat.path }}"

    - name: Copy trusted Root CA 4096 key
      copy:
        src: files/CertSrv-2036-4096.cer
        dest: "{{ cert_dir }}/CertSrv-2036-4096.cer"
        owner: root
        group: root
        mode: '0644'
