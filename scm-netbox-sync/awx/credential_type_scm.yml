# AWX > Administration > Credential Types > Add
# Name: Strata Cloud Manager
# --- Input configuration ---
fields:
  - id: client_id
    type: string
    label: Service account client ID
  - id: client_secret
    type: string
    label: Service account client secret
    secret: true
  - id: tsg_id
    type: string
    label: Tenant Service Group (TSG) ID
required: [client_id, client_secret, tsg_id]
# --- Injector configuration (paste separately) ---
# env:
#   SCM_CLIENT_ID: '{{ client_id }}'
#   SCM_CLIENT_SECRET: '{{ client_secret }}'
#   SCM_TSG_ID: '{{ tsg_id }}'
