# AWX > Administration > Credential Types > Add
# Name: NetBox API (skip if you already have one injecting NETBOX_API / NETBOX_TOKEN)
# --- Input configuration ---
fields:
  - id: url
    type: string
    label: NetBox URL
  - id: token
    type: string
    label: API token
    secret: true
required: [url, token]
# --- Injector configuration (paste separately) ---
# env:
#   NETBOX_API: '{{ url }}'
#   NETBOX_TOKEN: '{{ token }}'
