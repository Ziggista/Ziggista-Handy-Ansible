---
scm_page_size: 200
# NGFW Operations jobs accept 1-5 serials per request.
scm_ops_batch_size: 5
scm_ops_poll_retries: 24
scm_ops_poll_delay: 5
# NGFW Configuration interface collections read in config mode.
scm_config_interface_kinds:
  - ethernet-interfaces
  - aggregate-interfaces
  - layer3-subinterfaces
  - loopback-interfaces
  - tunnel-interfaces
  - vlan-interfaces
