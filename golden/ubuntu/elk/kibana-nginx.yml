---
- name: Deploy Kibana v2 (TLS Enabled)
  hosts: P-KIBANA-01
  become: true

    
# ============================================================
# NGINX Reverse Proxy for Kibana
# ============================================================
  tasks:
    
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure nginx SSL directory exists
      file:
        path: /etc/nginx/ssl
        state: directory
        mode: "0755"

    - name: Copy Kibana certificate
      copy:
        src: /etc/kibana/certs/P-KIBANA-01.cer
        dest: /etc/nginx/ssl/kibana.crt
        remote_src: true
        mode: "0644"

    - name: Copy Kibana private key
      copy:
        src: /etc/kibana/certs/P-KIBANA-01.key
        dest: /etc/nginx/ssl/kibana.key
        remote_src: true
        mode: "0600"

    - name: Configure nginx for Kibana
      copy:
        dest: /etc/nginx/sites-available/kibana
        content: |
          server {
              listen 80;
              server_name kibana.rrc.local;

              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name kibana.rrc.local;

              ssl_certificate     /etc/nginx/ssl/kibana.crt;
              ssl_certificate_key /etc/nginx/ssl/kibana.key;

              location / {

                  proxy_pass https://127.0.0.1:5601;

                  proxy_ssl_verify off;

                  proxy_http_version 1.1;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }

    - name: Enable Kibana nginx site
      file:
        src: /etc/nginx/sites-available/kibana
        dest: /etc/nginx/sites-enabled/kibana
        state: link
        force: yes

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Validate nginx configuration
      command: nginx -t
      changed_when: false

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
        enabled: true