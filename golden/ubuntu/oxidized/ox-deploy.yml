---
- name: Install and configure Oxidized (system-wide)
  hosts: P-OXIDIZED-01
  become: true

  vars:
    oxidized_user: oxidized
    oxidized_group: oxidized
    oxidized_home: /etc/oxidized
    oxidized_optional_web: true
    oxidized_optional_script: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Enable universe repository (Ubuntu only)
      apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
        state: present
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Install required packages
      apt:
        name:
          - ruby
          - ruby-dev
          - libsqlite3-dev
          - libssl-dev
          - pkg-config
          - cmake
          - libssh2-1-dev
          - libicu-dev
          - zlib1g-dev
          - g++
          - libyaml-dev
          - libzstd-dev
        state: present

    - name: Create oxidized group
      group:
        name: "{{ oxidized_group }}"
        system: yes

    - name: Create oxidized user with home directory
      user:
        name: "{{ oxidized_user }}"
        group: "{{ oxidized_group }}"
        system: yes
        shell: /usr/sbin/nologin
        create_home: yes
        home: /home/{{ oxidized_user }}

    - name: Ensure oxidized home directory permissions
      file:
        path: "/home/{{ oxidized_user }}"
        state: directory
        owner: "{{ oxidized_user }}"
        group: "{{ oxidized_group }}"
        mode: '0755'

    - name: Install bundler
      gem:
        name: bundler
        state: present
        user_install: no

    - name: Install Oxidized gem
      gem:
        name: oxidized
        state: present
        user_install: no

    - name: Install optional gems
      gem:
        name: "{{ item }}"
        state: present
        user_install: no
      loop:
        - oxidized-web
        - oxidized-script
      when: >
        (item == 'oxidized-web' and oxidized_optional_web) or
        (item == 'oxidized-script' and oxidized_optional_script)

    - name: Create oxidized base directory
      file:
        path: "{{ oxidized_home }}"
        state: directory
        owner: "{{ oxidized_user }}"
        group: "{{ oxidized_group }}"
        mode: '0755'

    - name: Initialize Oxidized configuration
      become: true
      become_user: "{{ oxidized_user }}"
      environment:
        OXIDIZED_HOME: "{{ oxidized_home }}"
      command: oxidized
      args:
        creates: "{{ oxidized_home }}/config"
      vars:
        ansible_shell_allow_world_readable_temp: true


