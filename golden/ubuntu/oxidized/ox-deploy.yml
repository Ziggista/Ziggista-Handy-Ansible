    - name: Verify oxidized installation
      command: oxidized --version
      register: oxidized_version
      changed_when: false

    - debug:
        var: oxidized_version.stdout

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/oxidized.service
        mode: '0644'
        content: |
          [Unit]
          Description=Oxidized Network Device Configuration Backup Tool
          After=network.target

          [Service]
          Environment=OXIDIZED_HOME={{ oxidized_home }}
          ExecStart=/usr/local/bin/oxidized
          User={{ oxidized_user }}
          Group={{ oxidized_group }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Enable and start oxidized
      systemd:
        name: oxidized
        enabled: yes
        state: started